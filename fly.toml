# Deploy on Fly.io (persistent disk, keeps the world between restarts):
#
#   fly launch --no-deploy --copy-config --name grimhollow
#   fly volumes create grimhollow_data --size 1
#   fly deploy
#
# `fly launch` will create the app and then `fly deploy` builds the Dockerfile.

app = "grimhollow"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  DB_PATH = "/data/grimhollow.sqlite"
  LLM_PROVIDER = "off"

[[mounts]]
  source = "grimhollow_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
