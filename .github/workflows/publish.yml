name: Build and publish image

# Builds the whole app into one image and publishes it to GitHub Container
# Registry, so the game can run anywhere Docker runs — no sandbox needed.
#
#   docker run -d -p 3001:3001 -v grimhollow-data:/data \
#     ghcr.io/grigoriy131112-sketch/grimhollow:latest
#
# Trigger a build by pushing to main, tagging a release, or from the Actions
# tab ("Run workflow").

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Docker Hub is frequently slow or unreachable from GitHub runners (we were
  # hit by repeated `504`/timeout on auth.docker.io). AWS's public mirror is
  # byte-identical and has stayed reliable, so Node is pulled from there.
  NODE_BASE: public.ecr.aws/docker/library/node:24-bookworm-slim

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      # The daemon's built-in builder, deliberately not buildx: buildx runs in a
      # container and pulls its buildkit image from Docker Hub, which kept
      # timing out on the runner. `docker build` pulls nothing from Docker Hub —
      # the only base image comes from the ECR mirror above.
      - name: Build
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && args="$args -t $tag"
          done <<< "$TAGS"
          docker build --build-arg NODE_BASE="$NODE_BASE" $args .

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"
