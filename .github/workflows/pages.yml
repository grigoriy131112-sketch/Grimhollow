name: Публикация на GitHub Pages

# Grimhollow — полностью статическая сборка: вся игра (Express-роутеры, сервисы,
# SQLite) работает в браузере через sql.js и IndexedDB, сервера держать не нужно.
# Источник Pages — ветка gh-pages, поэтому workflow пересобирает сайт из main и
# публикует результат туда. Ссылка постоянная:
# https://grigoriy131112-sketch.github.io/Grimhollow/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Прогнать тесты
        run: npm test

      - name: Собрать статическую версию
        run: npm run build:static

      - name: Опубликовать в ветку gh-pages
        run: |
          cd client/dist-static
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Пересборка сайта из ${GITHUB_SHA::7}"
          git push -q -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
