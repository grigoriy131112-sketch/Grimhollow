services:
  grimhollow:
    # Pulls the image published by .github/workflows/publish.yml, so `docker
    # compose up` needs no local build and no sandbox. To build from this
    # checkout instead, run:  docker compose up --build
    image: ghcr.io/grigoriy131112-sketch/grimhollow:latest
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      DB_PATH: /data/grimhollow.sqlite
      # Optional LLM re-wording. Leave off and the game uses its built-in replies.
      LLM_PROVIDER: "${LLM_PROVIDER:-off}"
      # LLM_API_KEY: "${LLM_API_KEY:-}"
      # LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      # LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
    volumes:
      - grimhollow-data:/data
    restart: unless-stopped

volumes:
  grimhollow-data:
